<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f2;--surface:#fff;--ink:#1c2b27;--muted:#5d6e68;--line:#d8e0dc;--brand:#1f4d43;--brand-ink:#fff;--accent:#f0b63a;--chip:#e3ece8;--danger:#c4452f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b18;--surface:#1a2622;--ink:#e8f0ec;--muted:#9bb0a8;--line:#2c3d37;--brand:#6fc2ab;--brand-ink:#0f1a16;--chip:#243630;--danger:#ef8a74}}
:root[data-theme="dark"]{--bg:#121b18;--surface:#1a2622;--ink:#e8f0ec;--muted:#9bb0a8;--line:#2c3d37;--brand:#6fc2ab;--brand-ink:#0f1a16;--chip:#243630;--danger:#ef8a74}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
button,select{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 20px 0;max-width:1080px;margin:0 auto}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:26px;color:var(--brand)}
nav{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:999px}
nav button{border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--muted)}
nav button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav .count{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--accent);color:#2b2000;font-size:12px}
button:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:1080px;margin:0 auto;padding:20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.swatch{height:84px;display:flex;align-items:flex-end;padding:10px 14px;font-size:12px;color:#fff;font-weight:500}
.card .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{color:var(--muted);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12px}
.row{display:flex;gap:8px;margin-top:auto}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);flex:1}
details{font-size:14px}summary{cursor:pointer;color:var(--muted)}
details ul{margin:6px 0 0;padding-left:18px}
.planner{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;vertical-align:top;text-align:left;width:12.5%}
th{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;color:var(--muted);font-size:14px}
tr>*:last-child{border-right:0}tr:last-child td{border-bottom:0}
td.mt{font-weight:500;color:var(--muted);font-size:13px}
.slot{display:block;width:100%;min-height:54px;border-radius:8px;border:1px dashed var(--line);background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:6px;text-align:left}
.slot.filled{border:0;color:#fff;font-weight:500;position:relative}
.slot.filled::after{content:"×";position:absolute;top:4px;right:8px;opacity:.8}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.toolbar select{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:560px}
.group{padding:14px 16px;border-bottom:1px solid var(--line)}.group:last-child{border:0}
.group h3{font-size:15px;color:var(--muted);margin-bottom:6px;font-weight:500}
label.item{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
label.item input{width:18px;height:18px;accent-color:var(--brand)}
label.item .q{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
label.item.done span:first-of-type{text-decoration:line-through;color:var(--muted)}
.empty{padding:32px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:22px;background:var(--surface);color:var(--ink);width:min(360px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}
dialog select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo">Mesa</div>
  <nav role="tablist" id="nav"></nav>
</header>
<main id="view"></main>
<dialog id="dlg">
  <h3 id="dtitle"></h3>
  <label for="dday">Day</label><select id="dday"></select>
  <label for="dmeal">Meal</label><select id="dmeal"></select>
  <div class="row" style="margin-top:18px"><button class="btn" id="dcancel">Cancel</button><button class="btn primary" id="dok">Add to plan</button></div>
</dialog>
<div class="toast" id="toast"></div>
<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],MEALS=["Breakfast","Lunch","Dinner"];
let R=[];
const api=(m,u,b)=>fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const S={tab:"recipes",tag:"all",plan:{},serv:2,checked:{}};
const $=s=>document.querySelector(s);
const rid=i=>R.find(r=>r.id===i);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1800)}
function shopping(){
  const m={};
  Object.values(S.plan).forEach(id=>{const r=rid(id);r.ing.forEach(([n,q,u,c])=>{const k=n+"|"+u;m[k]=m[k]||{n,u,c,q:0};m[k].q+=q*S.serv/r.sv})});
  return Object.values(m);
}
const fmt=q=>Math.round(q*10)/10;
function nav(){
  const n=Object.keys(S.plan).length;
  $("#nav").innerHTML=[["recipes","Recipes"],["planner","Week plan"],["shopping","Shopping list"]].map(([k,l])=>
   `<button role="tab" data-t="${k}" aria-selected="${S.tab===k}">${l}${k==="planner"&&n?`<span class="count">${n}</span>`:""}</button>`).join("");
}
function recipes(){
  const tags=["all",...new Set(R.flatMap(r=>r.tags))];
  const list=R.filter(r=>S.tag==="all"||r.tags.includes(S.tag));
  return `<div class="bar">${tags.map(t=>`<button class="chip" data-tag="${t}" aria-pressed="${S.tag===t}">${t==="all"?"All recipes":t}</button>`).join("")}</div>
  <div class="grid">${list.map(r=>`<article class="card"><div class="swatch" style="background:${r.c}">${r.time} min · serves ${r.sv}</div>
   <div class="body"><h3>${r.t}</h3><div class="tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
   <details><summary>${r.ing.length} ingredients</summary><ul>${r.ing.map(i=>`<li>${i[1]} ${i[2]} ${i[0].toLowerCase()}</li>`).join("")}</ul></details>
   <div class="row"><button class="btn primary" data-add="${r.id}">Add to plan</button></div></div></article>`).join("")}</div>`;
}
function planner(){
  const body=MEALS.map(m=>`<tr><td class="mt">${m}</td>${DAYS.map(d=>{const id=S.plan[d+"|"+m];const r=id&&rid(id);
   return `<td>${r?`<button class="slot filled" style="background:${r.c}" data-rm="${d}|${m}" aria-label="Remove ${r.t}">${r.t}</button>`:`<button class="slot" data-empty="1">Empty</button>`}</td>`}).join("")}</tr>`).join("");
  return `<div class="toolbar"><h2>This week</h2><label>Cooking for <select id="serv">${[1,2,3,4,5,6].map(n=>`<option ${n===S.serv?"selected":""}>${n}</option>`).join("")}</select> people</label></div>
  <div class="planner"><table><thead><tr><th></th>${DAYS.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
  <p class="meta">Select a meal to remove it. Add meals from the Recipes tab.</p>`;
}
function shop(){
  const items=shopping();
  if(!items.length)return `<div class="empty"><h2>Nothing to buy yet</h2><p>Add meals to your week plan and the ingredients will be combined here.</p><button class="btn primary" data-t="recipes">Browse recipes</button></div>`;
  const g={};items.forEach(i=>(g[i.c]=g[i.c]||[]).push(i));
  return `<div class="toolbar"><h2>Shopping list</h2><span class="meta">${items.length} items for ${S.serv} people</span></div>
  <div class="list">${Object.keys(g).sort().map(c=>`<div class="group"><h3>${c}</h3>${g[c].sort((a,b)=>a.n.localeCompare(b.n)).map(i=>{const k=i.n+"|"+i.u;
   return `<label class="item ${S.checked[k]?"done":""}"><input type="checkbox" data-ck="${k}" ${S.checked[k]?"checked":""}><span>${i.n}</span><span class="q">${fmt(i.q)} ${i.u}</span></label>`}).join("")}</div>`).join("")}</div>`;
}
function render(){nav();$("#view").innerHTML=S.tab==="recipes"?recipes():S.tab==="planner"?planner():shop()}
let pending=null;
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-t],[data-tag],[data-add],[data-rm],[data-empty]");if(!b)return;
  if(b.dataset.t){S.tab=b.dataset.t;render()}
  else if(b.dataset.tag){S.tag=b.dataset.tag;render()}
  else if(b.dataset.add){pending=+b.dataset.add;$("#dtitle").textContent="Add "+rid(pending).t;$("#dlg").showModal()}
  else if(b.dataset.rm){const [d,m]=b.dataset.rm.split("|");api("DELETE","/api/plan/"+d+"/"+m);delete S.plan[b.dataset.rm];render();toast("Removed from plan")}
  else if(b.dataset.empty){S.tab="recipes";render()}
});
$("#dday").innerHTML=DAYS.map(d=>`<option>${d}</option>`).join("");
$("#dmeal").innerHTML=MEALS.map(d=>`<option>${d}</option>`).join("");
$("#dcancel").onclick=()=>$("#dlg").close();
$("#dok").onclick=()=>{api("PUT","/api/plan",{day:$("#dday").value,meal:$("#dmeal").value,recipe_id:pending});S.plan[$("#dday").value+"|"+$("#dmeal").value]=pending;$("#dlg").close();render();toast("Added to "+$("#dday").value+" "+$("#dmeal").value.toLowerCase())};
document.addEventListener("change",e=>{
  if(e.target.id==="serv"){S.serv=+e.target.value}
  if(e.target.dataset.ck){S.checked[e.target.dataset.ck]=e.target.checked;render()}
});
Promise.all([api("GET","/api/recipes"),api("GET","/api/plan")]).then(([r,p])=>{R=r;S.plan=p;render()});
</script>
</body>
</html>
